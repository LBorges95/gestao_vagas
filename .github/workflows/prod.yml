name: Gestão de Vagas - CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:
    name: Compilar e testar
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: gestao_vagas

    steps:

      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: gestao_vagas/pom.xml

      - name: Dar permissão ao Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar e executar testes
        run: ./mvnw --batch-mode clean verify


  publish-image:
    name: Publicar imagem Docker
    runs-on: ubuntu-latest

    needs:
      - build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validar credenciais do Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "Erro: DOCKERHUB_USERNAME não foi configurado."
            exit 1
          fi

          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Erro: DOCKERHUB_TOKEN não foi configurado."
            exit 1
          fi

          echo "Credenciais do Docker Hub encontradas."

      - name: Login no Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir e publicar imagem
        uses: docker/build-push-action@v7
        with:
          context: ./gestao_vagas
          file: ./gestao_vagas/Dockerfile
          push: true
          tags: |
            lborges95/gestao_vagas:latest
            lborges95/gestao_vagas:${{ github.sha }}