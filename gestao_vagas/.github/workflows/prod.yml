name: Gestão de Vagas - CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar e testar
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: gestao_vagas

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: gestao_vagas/pom.xml

      - name: Dar permissão ao Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar e executar testes
        run: ./mvnw --batch-mode clean verify